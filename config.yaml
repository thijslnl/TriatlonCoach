# Triatlon Coach - configuratie
# Dit bestand wordt beheerd via de instellingen-tab in het dashboard;
# handmatig aanpassen kan ook (uitleg per veld: zie README.md).
athlete:
  name: Thijs
  max_hr: 193
  thresholds:
    running:
      lthr: 170
      lthr_source: 'Garmin-schatting, bevestigd door de atleet; stabiel op 170 sinds
        juni 2026. Let op: Garmin stelde deze waarde op 29-07-2026 kortstondig bij
        naar 164 na een brick-training — de fietsbelasting vóór het lopen drukt de
        drempelschatting. Zo''n dip na een brick is een meetartefact, niet een drempeldaling;
        alleen een dip in een losse loopsessie is een signaal.'
    cycling:
      lthr: 164
      ftp: 264.0
      provisional: true
      review_reason: geschat, niet gemeten — 6 bpm onder de loop-LTHR en passend bij
        de eigen duurdata; een 20-minutentest geeft de echte waarde (gem. HR over
        dat blok)
      review_after: '2026-09-23'
      ftp_provisional: true
      ftp_review_reason: handmatig ingevuld, niet uit een ramptest of 20-minutentest
        afgeleid
      ftp_review_after: '2026-09-23'
  zone_pct_lthr:
  - 0.8
  - 0.89
  - 0.95
  - 1.0
  training_days: Zwemmen ma/vr-ochtend, optioneel vr-avond, lange duurtraining zondag
  session_time: 30-45 min doordeweeks, 1,5-2 uur op zondag
races:
- name: DTS Ouderkerk
  date: 2026-08-22
  swim_m: 1500
  bike_m: 40000
  run_m: 10000
  distances: 1,5km zwemmen / 40km fietsen / 10km lopen
  goal: Goed finishen (eerste race)
  target_time: ''
- name: IRONMAN 70.3 Luxembourg (Remich)
  date: 2027-07-11
  swim_m: 1900
  bike_m: 90000
  run_m: 21100
  distances: 1,9km zwemmen / 90km fietsen / 21,1km lopen
  goal: Goed finishen (primaire doelrace)
  target_time: ''
combo:
  max_gap_min: 25
llm:
  ollama:
    host: http://192.168.50.120:11434
    model: gemma4:12b
    timeout_s: 120
  anthropic:
    model: claude-sonnet-5
    max_tokens: 6000
    cost_per_mtok_input_usd: 3.0
    cost_per_mtok_output_usd: 15.0
    task_models:
      feedback: claude-sonnet-5
    task_max_tokens:
      feedback: 6000
      advice: 8000
      trends: 6000
    model_prices:
      claude-sonnet-5:
        input: 3.0
        output: 15.0
      claude-sonnet-4-6:
        input: 3.0
        output: 15.0
      claude-haiku-4-5-20251001:
        input: 1.0
        output: 5.0
  routing:
    session_summary: ollama
    qa_simple: ollama
    qa_complex: anthropic
    advice: anthropic
    trends: anthropic
    feedback: anthropic
    body_trend: ollama
paths:
  database: data/training.db
  memory_dir: memory
  import_dir: garmin_import
  uploads_dir: uploads
